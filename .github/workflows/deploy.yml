name: Validate and deploy website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: ${{ vars.PAGES_CUSTOM_DOMAIN && format('https://{0}', vars.PAGES_CUSTOM_DOMAIN) || 'https://saturdaysai.github.io' }}
      BASE_PATH: ${{ vars.PAGES_CUSTOM_DOMAIN && '/' || '/saturdaysai-web' }}
      PUBLIC_SITE_MODE: ${{ vars.PAGES_CUSTOM_DOMAIN && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate content and website
        id: verify
        run: |
          mkdir -p artifacts/publication
          set -o pipefail
          npm run verify 2>&1 | tee artifacts/publication/verify.log
      - name: Explain publication status
        if: always()
        continue-on-error: true
        env:
          VALIDATION_OUTCOME: ${{ steps.verify.outcome }}
        run: node scripts/ci-summary.mjs
      - name: Save publication diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: publication-diagnostics
          path: |
            artifacts/publication/
            artifacts/bilingual-theme/coverage.json
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
